<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>배경화면 저장</title>
<style>
:root{--bg:#0c0c0f;--ink:#fff;--sub:#a7a7b0;--acc:#ff4d6d;--line:#26262e}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 18px calc(22px + env(safe-area-inset-bottom));gap:16px;text-align:center}
.shot{position:relative;max-width:min(80vw,240px);max-height:54vh;border-radius:22px;overflow:hidden;background:#17171c;box-shadow:0 12px 40px rgba(0,0,0,.5);border:1px solid var(--line)}
.shot img{display:block;width:auto;height:auto;max-width:100%;max-height:54vh;-webkit-touch-callout:default}
.shot .ph{width:min(80vw,240px);aspect-ratio:9/19.5;max-height:54vh;display:flex;align-items:center;justify-content:center;color:#55555f;font-size:13px}
h1{font-size:19px;margin:2px 0 0;letter-spacing:-.02em}
p{color:var(--sub);font-size:14px;margin:0;line-height:1.55;max-width:320px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;min-height:54px;border-radius:15px;background:#fff;color:#111;font-weight:800;font-size:16px;text-decoration:none;border:0;cursor:pointer}
.btn svg{width:19px;height:19px}
.tip{display:flex;align-items:center;gap:8px;background:#17171c;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--sub);max-width:340px;text-align:left;line-height:1.5}
.tip b{color:var(--ink);font-weight:700}
.hand{font-size:20px;flex:none}
[hidden]{display:none!important}
.done{font-size:13px;color:var(--acc);font-weight:700;min-height:18px}
</style></head><body>
<div class="wrap">
  <div class="shot">
    <img id="img" alt="배경화면" hidden>
    <div class="ph" id="ph">이미지를 불러오는 중…</div>
  </div>
  <h1 id="title">배경화면 저장</h1>

  <!-- Android / PC -->
  <div id="android" hidden style="display:contents">
    <p>아래 버튼을 누르면 배경화면 이미지가 저장됩니다.</p>
    <a class="btn" id="dl" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
      배경화면 저장
    </a>
    <div class="done" id="done"></div>
  </div>

  <!-- iOS -->
  <div id="ios" hidden style="display:contents">
    <div class="tip"><span class="hand">👆</span><span>위 이미지를 <b>길게 누른 뒤</b> <b>‘사진에 저장’</b>을 선택하세요.<br>아이폰은 이 방법으로만 저장할 수 있어요.</span></div>
  </div>
</div>
<script>
(function(){
  // 배경화면 이미지 경로/파일명 — 이미지 교체 시 이 두 줄만 수정
  var IMG = 'images/wallpaper.jpg';
  var FILENAME = 'SLBS-wallpaper.jpg';

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPod|iPad/.test(ua) || (/Macintosh/.test(ua) && (navigator.maxTouchPoints||0) > 1);
  var img = document.getElementById('img'), ph = document.getElementById('ph');

  img.onload = function(){ img.hidden = false; ph.hidden = true; };
  img.onerror = function(){ ph.textContent = '이미지를 찾을 수 없습니다 (' + IMG + ')'; };
  img.src = IMG;

  if (isIOS) {
    document.getElementById('ios').hidden = false;
    document.getElementById('title').textContent = '배경화면 저장';
  } else {
    document.getElementById('android').hidden = false;
    var a = document.getElementById('dl');
    a.href = IMG; a.setAttribute('download', FILENAME);
    // 접속 즉시 한 번 자동 저장 시도(브라우저가 막으면 버튼으로)
    var tried = false;
    function autodl(){ if (tried) return; tried = true; try { var t = document.createElement('a'); t.href = IMG; t.download = FILENAME; document.body.appendChild(t); t.click(); t.remove(); document.getElementById('done').textContent = '저장을 시작했어요. 안 되면 위 버튼을 누르세요.'; } catch(e){} }
    img.addEventListener('load', function(){ setTimeout(autodl, 400); });
    a.addEventListener('click', function(){ document.getElementById('done').textContent = '저장 폴더를 확인하세요.'; });
  }
})();
</script></body></html>
